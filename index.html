<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111b32" />
    <title>Hackathon · Admin</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    <div class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Навигация">
        <div class="brand"><span class="brand-mark" id="brand-mark">H</span><span><strong id="brand-name">Hackathon</strong><small>Admin workspace</small></span></div>
        <div class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</div>
        <nav id="navigation" aria-label="Разделы"></nav>
        <div class="sidebar-note"><span class="note-dot"></span><div><strong id="mode-title">Демонстрация</strong><small id="mode-description">Данные сохранены в этом браузере</small></div></div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <button type="button" class="icon-button menu-button" id="menu-button" aria-label="Открыть меню" aria-expanded="false">☰</button>
          <div class="breadcrumb"><span id="header-brand">Hackathon</span><span class="slash">/</span><strong id="current-page">Обзор</strong></div>
          <span class="topbar-badge" id="mode-badge">Демо</span>
        </header>
        <main id="main-content" class="content" tabindex="-1"><p class="loading">Загрузка…</p></main>
      </div>
    </div>
    <dialog id="editor" class="editor" aria-labelledby="editor-title">
      <form id="editor-form" class="editor-body">
        <div class="dialog-heading"><div><p class="eyebrow">РЕДАКТИРОВАНИЕ</p><h2 id="editor-title"></h2></div><button class="icon-button" type="button" id="close-editor" aria-label="Закрыть">✕</button></div>
        <div id="form-fields" class="form-fields"></div>
        <div class="dialog-actions"><button class="button button-secondary" type="button" id="cancel-editor">Отмена</button><button class="button button-primary" type="submit">Сохранить</button></div>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./assets/main.js"></script>
  </body>
</html>
