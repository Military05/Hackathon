name: Backend and interface
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai.txt
            requirements-ai-dev.txt
      # Runtime discovery includes AI/ML integration tests, not just the basic server.
      # Keep requirements.txt lightweight for users; install full test dependencies here.
      - run: python -m pip install -r requirements-ai-dev.txt
      - run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/qa -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/interface/web/app.js
      - run: node --check src/interface/web/map-view.js
      - run: node --check src/interface/web/sensors-panel.js
      - run: node --check src/interface/web/auth-view.js
      - run: node --check src/interface/web/operations-view.js
      - run: node --check src/interface/web/progress-view.js
      - run: node --test tests/interface/*.cjs
      - run: node --test tests/interface.test.js
      - run: node --test tests/map-view.test.cjs tests/sensors-panel.test.cjs
