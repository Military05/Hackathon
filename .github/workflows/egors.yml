name: Backend and interface
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests/runtime -p 'test_*.py' -v
      - run: python -m unittest discover -s tests/qa -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/interface/web/app.js
      - run: node --test tests/interface/*.cjs
